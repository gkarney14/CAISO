name: Refresh CAISO prices
on:
  schedule:
    - cron: "17 22 * * *"   # daily ~3 pm PT, after day-ahead results post
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_prices.py 365
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || git commit -m "Refresh CAISO prices $(date -u +%F)"
          git push
