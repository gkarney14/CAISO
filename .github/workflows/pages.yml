name: Live dashboard (fetch CAISO + deploy Pages)
on:
  schedule:
    - cron: "*/30 * * * *"   # backup only; the ADS-B box triggers a run every 5 minutes
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false   # queue runs; cancelling mid-deploy leaves a stuck Pages deployment
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch live CAISO prices + irradiance
        run: |
          pip install --quiet pvlib pandas
          python scripts/fetch_live.py
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html sim.js _site/
          cp -r live _site/
          cp data/prices.json data/live.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true      # a previous deployment may still be finalizing
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 75
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
